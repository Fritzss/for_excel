name: Build Docker Image excel-processor

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the image (e.g. v1.0.0)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: excel-processor:${{ inputs.tag }}

      - name: Save image
        run: |
          docker save excel-processor:${{ inputs.tag }} \
            | gzip > excel-processor-${{ inputs.tag }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel-processor-${{ inputs.tag }}
          path: excel-processor-${{ inputs.tag }}.tar.gz
